name: PenLink
options:
  bundleIdPrefix: com.penlink
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PenLink:
    type: application
    platform: iOS
    sources:
      - PenLink
    info:
      path: PenLink/Info.plist
      properties:
        CFBundleDisplayName: PenLink
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: PenLink talks to your PC through the USB cable.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.penlink.ipad
